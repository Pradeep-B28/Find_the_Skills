<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Job Post X-Ray by Wrench Wise</title>
  <meta name="description" content="Paste any job post. See every skill it asks for, and how many you already have.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">

  <!-- Open Graph -->
  <meta property="og:title" content="Job Post X-Ray by Wrench Wise">
  <meta property="og:description" content="Paste any job post. See every skill it asks for, and how many you already have.">
  <meta property="og:image" content="https://job-post-xray.vercel.app/assets/og-image.png">
  <meta property="og:url" content="https://job-post-xray.vercel.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/xray.css">
  <link rel="stylesheet" href="styles/result.css">
</head>
<body>
  <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-2" aria-hidden="true"></div>
  <header class="app-header">
    <div class="header-container">
      <a href="./" class="header-brand" aria-label="Job Post X-Ray Home">
        <img src="assets/logo.png" alt="Wrench Wise" class="brand-logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='inline';">
        <span id="logo-fallback" class="brand-fallback" style="display: none;">Wrench Wise</span>
        <span class="header-divider" aria-hidden="true"></span>
        <span class="header-title">Job Post X-Ray</span>
      </a>

      <div class="header-controls">
        <button id="btn-sound" class="icon-btn" aria-label="Toggle sound" title="Toggle sound">
          <svg viewBox="0 0 24 24" id="sound-icon" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <button id="btn-theme" class="icon-btn" aria-label="Toggle dark/light theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" id="theme-icon" aria-hidden="true">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="brand-gradient-bar" aria-hidden="true"></div>
  </header>

  <main id="app" class="app-main"></main>

  <div id="live-region" class="sr-only" aria-live="polite" style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;"></div>

  <footer class="app-footer">
    <div class="footer-container">
      <div>Built with code by Wrench Wise</div>
      <div class="footer-links">
        <a href="https://wrench-wise.com/?utm_source=job-post-xray&utm_medium=web-app&utm_campaign=job-post-xray-2026&utm_content=footer" target="_blank" rel="noopener">Learn to build apps like this</a>
        <span class="footer-version" id="footer-version">v1.0.0</span>
      </div>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
